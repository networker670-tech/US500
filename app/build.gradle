plugins {
    id 'com.android.application'
}

android {
    namespace 'cz.leo.us500screenbot'
    compileSdk 35

    defaultConfig {
        applicationId 'cz.leo.us500screenbot'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled Latin OCR model. Works offline after installation.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
